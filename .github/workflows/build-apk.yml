name: Build SignKeyboard AI APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Materialize SignKeyboard AI v2.0.0 Source Tree
        run: |
          python3 - << 'PYEOF'
          import base64, json, lzma
          from pathlib import Path
          b64_ks = ""
          b64_src = ""
          data = json.loads(lzma.decompress(base64.b64decode(b64_src)).decode("utf-8"))
          for rel, content in data.items():
              p = Path(rel)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8")
          print("Materialized", len(data), "files + debug.keystore successfully.")
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync SignKeyboard AI v2.0.0 source files [skip ci]"
            git push origin HEAD || true
          fi

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download MediaPipe Hand Landmarker Model (hand_landmarker.task)
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/hand_landmarker.task ]; then
            curl -L -o app/src/main/assets/hand_landmarker.task \
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
          fi
          ls -lh app/src/main/assets/hand_landmarker.task

      - name: Verify Fixed Debug Keystore for Conflict-Free Updates
        run: |
          keytool -list -v -keystore app/debug.keystore -storepass android | grep -E "Alias|SHA256"

      - name: Setup Gradle (Wrapper-Free Support)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK (v2.0.0)
        run: gradle assembleDebug --stacktrace

      - name: Verify APK Package ID, VersionCode, and Signature
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Built APK: $APK_PATH"
          ls -lh "$APK_PATH"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK_PATH" | head -n 5
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$APK_PATH"

      - name: Upload SignKeyboardAI-debug-apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignKeyboardAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
